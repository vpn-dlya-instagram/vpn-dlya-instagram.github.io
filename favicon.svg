<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FCAF45"/>
      <stop offset="35%"  stop-color="#F77737"/>
      <stop offset="60%"  stop-color="#E1306C"/>
      <stop offset="85%"  stop-color="#C13584"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
    <linearGradient id="iw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M16 1.5 L28.5 6.5 L28.5 17.5 Q28.5 26 16 30.5 Q3.5 26 3.5 17.5 L3.5 6.5 Z"
        fill="url(#ig)"/>
  <!-- Inner highlight -->
  <path d="M16 3.5 L27 8 L27 17.5 Q27 24.5 16 28.5 Q5 24.5 5 17.5 L5 8 Z"
        fill="url(#iw)" opacity="0.3"/>
  <!-- Camera body (rounded rect) -->
  <rect x="10" y="11" width="12" height="10" rx="2.5" fill="none"
        stroke="white" stroke-width="1.5"/>
  <!-- Camera lens (circle) -->
  <circle cx="16" cy="16" r="3" fill="none"
          stroke="white" stroke-width="1.5"/>
  <!-- Flash dot -->
  <circle cx="20.5" cy="12.5" r="1" fill="white"/>
</svg>
